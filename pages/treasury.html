<div class="flex flex-nowrap gap-2 mb-6">
    <button onclick="openModal('modal-fee')" class="flex-1 bg-brand text-white px-2 py-1.5 rounded-lg shadow hover:bg-blue-900 transition text-xs font-semibold text-center">
        <i class="fas fa-money-bill-wave mr-1"></i> Fees
    </button>
    <button onclick="openModal('modal-unexpected')" class="flex-1 bg-accent text-white px-2 py-1.5 rounded-lg shadow hover:bg-yellow-700 transition text-xs font-semibold text-center">
        <i class="fas fa-hand-holding-usd mr-1"></i> Unexpected
    </button>
    <button onclick="exportFeesToExcel()" class="flex-1 bg-green-600 text-white px-2 py-1.5 rounded-lg shadow hover:bg-green-700 transition text-xs font-semibold text-center">
        <i class="fas fa-file-excel mr-1"></i> Excel
    </button>
</div>

<div class="bg-white p-4 sm:p-6 rounded-xl shadow-sm mb-6 overflow-x-auto">
    <h3 class="font-bold text-gray-700 mb-4 text-sm sm:text-base">November Monthly Fees Tracker</h3>
    <table class="w-full text-left border-collapse text-xs sm:text-sm">
        <thead>
            <tr class="border-b-2 border-gray-200 bg-gray-50">
                <th class="py-3 px-3 font-semibold text-gray-600">Member</th>
                <th class="py-3 px-3 font-semibold text-gray-600">Amount</th>
                <th class="py-3 px-3 font-semibold text-gray-600">Status</th>
                <th class="py-3 px-3 font-semibold text-gray-600">Receipt</th>
            </tr>
        </thead>
        <tbody>
            <tr class="border-b border-gray-100 hover:bg-gray-50">
                <td class="py-3 px-3 font-medium">John Doe</td>
                <td class="py-3 px-3">$50.00</td>
                <td class="py-3 px-3"><span class="bg-green-100 text-green-700 text-[10px] px-2 py-0.5 rounded-full font-bold">Paid</span></td>

            </tr>
            <tr class="border-b border-gray-100 hover:bg-gray-50">
                <td class="py-3 px-3 font-medium">Jane Smith</td>
                <td class="py-3 px-3">$50.00</td>
                <td class="py-3 px-3"><span class="bg-red-100 text-red-700 text-[10px] px-2 py-0.5 rounded-full font-bold">Unpaid</span></td>
                <td class="py-3 px-3"><span class="text-gray-400">N/A</span></td>
            </tr>
        </tbody>
    </table>
</div>
